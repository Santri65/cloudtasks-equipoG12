<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudTasks</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<section id="auth-section" class="auth-container">
    <div class="auth-card">
        <div class="header-title">
            <h1>CloudTasks</h1>
            <p>Enter your email to receive a magic sign-in link</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input
                        type="email"
                        id="login-email"
                        name="login-email"
                        placeholder="you@example.com"
                        required
                >
            </div>

            <div class="form-actions" style="margin-top: 1rem;">
                <button type="submit" id="login-button">Send Magic Link</button>
            </div>
        </form>

        <p id="auth-message" class="auth-message" style="margin-top: 1rem; text-align: center;"></p>
    </div>
</section>


<div id="app-section" style="display: none;">

    <header>

        <div class="header-title">
            <h1>CloudTasks</h1>
            <p>Manage your tasks</p>
        </div>

        <div class="task-menu">

            <button
                    id="new-task-button"
                    type="button"
                    aria-expanded="false"
                    aria-controls="task-form-section"
            >
                + New Task
            </button>

            <button
                    id="logout-button"
                    type="button"
                    style="background-color: transparent; border: 1px solid currentColor; margin-left: 0.5rem;"
            >
                Logout
            </button>

            <section
                    id="task-form-section"
                    class="task-form-popover"
                    aria-hidden="true"
            >

                <div class="task-form-heading">

                    <div>
                        <p class="eyebrow">Quick action</p>
                        <h2>Create New Task</h2>
                    </div>

                    <button
                            type="button"
                            class="close-form-button"
                            id="close-task-button"
                            aria-label="Close new task form"
                    >
                        &times;
                    </button>

                </div>


                <form id="task-form">

                    <div class="form-group">

                        <label for="title">
                            Title
                        </label>

                        <input
                                type="text"
                                id="title"
                                name="title"
                                required
                        >

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                                id="description"
                                name="description"
                        ></textarea>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="deadline">
                                Deadline
                            </label>

                            <input
                                    type="date"
                                    id="deadline"
                                    name="deadline"
                            >

                        </div>


                        <div class="form-group">

                            <label for="priority">
                                Priority
                            </label>

                            <select
                                    id="priority"
                                    name="priority"
                            >
                                <option value="low">
                                    Low
                                </option>

                                <option value="medium" selected>
                                    Medium
                                </option>

                                <option value="high">
                                    High
                                </option>
                            </select>

                        </div>

                    </div>


                    <div class="form-actions">

                        <button
                                type="button"
                                id="cancel-task-button"
                        >
                            Cancel
                        </button>

                        <button
                                type="submit"
                                id="save-task-button"
                        >
                            Create Task
                        </button>

                    </div>

                </form>

            </section>

        </div>

    </header>


    <main>

        <section id="task-summary">

            <div class="summary-card">

                <h2>All</h2>

                <span id="total-tasks">
                        0
                    </span>

            </div>


            <div class="summary-card">

                <h2>Pending</h2>

                <span id="pending-tasks">
                        0
                    </span>

            </div>


            <div class="summary-card">

                <h2>Completed</h2>

                <span id="completed-tasks">
                        0
                    </span>

            </div>

        </section>


        <section id="tasks-section">

            <div class="section-header">
                <h2>Tasks</h2>
            </div>


            <div id="task-list">

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>

</body>

</html>
